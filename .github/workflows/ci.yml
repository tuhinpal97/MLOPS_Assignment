name: mlops-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-train-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest -q --junitxml=artifacts/pytest.xml
      - name: Prepare data and EDA
        run: |
          python scripts/download_data.py
          python -m src.eda
      - name: Train and track experiments
        run: python -m src.train --tracking-uri file:./mlruns
      - name: Build Docker image
        run: docker build -t heart-disease-api:${{ github.sha }} .
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heart-mlops-artifacts
          path: |
            artifacts/
            mlruns/
